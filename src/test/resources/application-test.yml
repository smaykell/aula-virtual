spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aula_virtual_test}
    username: ${DB_USER:aula_virtual}
    password: ${DB_PASSWORD:aula_virtual}
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false
    baseline-on-migrate: true

logging:
  level:
    root: WARN
    io.github.smaykell.aulavirtual: INFO

app:
  notifications:
    # Apagado en los tests: el contexto completo no debe arrancar un hilo que
    # sondee la base y siga vivo cuando el contexto ya se ha cerrado.
    enabled: false
  exams:
    # Por la misma razon: sin barrido de intentos vencidos durante los tests.
    sweep-enabled: false
  security:
    jwt:
      # Secreto fijo para que los tests sean reproducibles. No sale de src/test.
      secret: c2VjcmV0by1kZS1wcnVlYmFzLWNvbi1tYXMtZGUtMzItYnl0ZXM=
      issuer: aula-virtual
      expiration: PT1H
