spring:
  application:
    name: aula-virtual
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aula_virtual}
    username: ${DB_USER:aula_virtual}
    password: ${DB_PASSWORD:aula_virtual}
    hikari:
      pool-name: aula-virtual-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la unica fuente de verdad del esquema; JPA solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
  mail:
    # host no se declara aqui a proposito. Es lo unico que enciende el envio real, y
    # ${SPRING_MAIL_HOST:} lo dejaria definido y vacio, que para Spring no es lo mismo
    # que ausente: el autoconfig arrancaria contra un servidor en blanco y todos los
    # correos fallarian en vez de irse al log.
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SPRING_MAIL_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SPRING_MAIL_STARTTLS:true}
      # El envio es sincrono sobre el hilo del planificador: sin timeouts, un servidor
      # que no responde deja la cola parada indefinidamente.
      "[mail.smtp.connectiontimeout]": ${SPRING_MAIL_TIMEOUT:5000}
      "[mail.smtp.timeout]": ${SPRING_MAIL_TIMEOUT:5000}
      "[mail.smtp.writetimeout]": ${SPRING_MAIL_TIMEOUT:5000}
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    poll-interval: ${NOTIFICATIONS_POLL_INTERVAL:PT30S}
    batch-size: ${NOTIFICATIONS_BATCH_SIZE:50}
    max-attempts: ${NOTIFICATIONS_MAX_ATTEMPTS:5}
    retry-delay: ${NOTIFICATIONS_RETRY_DELAY:PT1M}
    from: ${NOTIFICATIONS_FROM:aula-virtual@localhost}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  accounts:
    password-reset-url: ${PASSWORD_RESET_URL:http://localhost:5173/reset-password}
    password-reset-lifetime: ${PASSWORD_RESET_LIFETIME:PT30M}
    password-reset-cooldown: ${PASSWORD_RESET_COOLDOWN:PT2M}
    login-throttle:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_FAILURE_WINDOW:PT15M}
      lockout: ${LOGIN_LOCKOUT:PT15M}
  storage:
    # En blanco apunta a AWS S3; con valor, a cualquier servicio compatible (MinIO, R2...).
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:aula-virtual}
    access-key: ${STORAGE_ACCESS_KEY:aula_virtual}
    secret-key: ${STORAGE_SECRET_KEY:aula_virtual}
    path-style: ${STORAGE_PATH_STYLE:true}
    upload-ttl: ${STORAGE_UPLOAD_TTL:PT15M}
    download-ttl: ${STORAGE_DOWNLOAD_TTL:PT10M}
  courses:
    invitation-base-url: ${COURSE_INVITATION_BASE_URL:http://localhost:5173/join}
  security:
    jwt:
      # Vacio por defecto y sin perfil por defecto: @NotBlank corta el arranque sin JWT_SECRET.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:aula-virtual}
      expiration: ${JWT_EXPIRATION:PT1H}
