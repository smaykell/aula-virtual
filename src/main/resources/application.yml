spring:
  application:
    name: aula-virtual
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aula_virtual}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: aula-virtual-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es la unica fuente de verdad del esquema; JPA solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  security:
    jwt:
      # Vacio por defecto y sin perfil por defecto: @NotBlank corta el arranque sin JWT_SECRET.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:aula-virtual}
      expiration: ${JWT_EXPIRATION:PT1H}
